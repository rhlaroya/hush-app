<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hush</title>
  
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script type="text/babel">
    // Define the sound globally for easy access
    const RECEIVE_SOUND_DATA_URL = 'data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYHGGS57OihUBELTqXh8LJeGgU7kdXw0YU2Bx1osOvhoU8PC0qh4PC0YhwGPpHV8NKHOQUE';

    // ⚠️ REPLACE WITH YOUR ACTUAL FIREBASE CONFIG ⚠️
    const firebaseConfig = {
      apiKey: "AIzaSyDhpiBs71WG_YPr0Ztl_ZBKjYG2hzBcJUc",
      authDomain: "hush-app-14725.firebaseapp.com",
      databaseURL: "https://hush-app-14725-default-rtdb.firebaseio.com",
      projectId: "hush-app-14725",
      storageBucket: "hush-app-14725.firebasestorage.app",
      messagingSenderId: "915121601862",
      appId: "1:915121601862:web:f6992c7d83e8359ef63947"
    };

    // Initialize Firebase only once
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    const { useState, useEffect, useRef } = React;

    function HushApp() {
      const [nickname, setNickname] = useState('');
      const [currentUser, setCurrentUser] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [error, setError] = useState('');
      const [onlineUsers, setOnlineUsers] = useState({});
      const messagesEndRef = useRef(null);
      const prevMessagesRef = useRef([]); 
      const transientTimeoutsRef = useRef({}); 
      
      const isMaster = currentUser === 'regae';

      // Display names mapping
      const getDisplayName = (user) => {
        return user === 'regae' ? 'heirofvenus' : 'heiressofvenus';
      };

      // Load user session
      useEffect(() => {
        const stored = sessionStorage.getItem('hushvenus_user');
        if (stored) {
          setCurrentUser(stored.toLowerCase());
        }
      }, []);
      
      // Helper function to play sound safely
      const playReceiveSound = () => {
        const sound = new Audio(RECEIVE_SOUND_DATA_URL);
        sound.volume = 0.3;
        sound.play().catch(error => {
          console.warn("Audio playback blocked by browser:", error.message);
        });
      };


      // ------------------------------------------------------------------
      // FIREBASE IMPLEMENTATION: ONLINE STATUS MANAGEMENT
      // ------------------------------------------------------------------
      useEffect(() => {
        if (!currentUser) return;

        const userStatusRef = db.ref(`users/${currentUser}/online`);
        const otherUser = currentUser === 'regae' ? 'phish' : 'regae';
        const otherUserStatusRef = db.ref(`users/${otherUser}/online`);

        userStatusRef.onDisconnect().set(false);
        userStatusRef.set(true);

        otherUserStatusRef.on('value', (snapshot) => {
          const isOnline = snapshot.val() === true;
          setOnlineUsers({ [otherUser]: isOnline });
        });

        return () => {
          otherUserStatusRef.off('value');
          userStatusRef.onDisconnect().cancel(); 
        };
      }, [currentUser]);
      
      
      // ------------------------------------------------------------------
      // 🔥 REFACTORED: ROLE-BASED MESSAGE LISTENERS & SELF-DESTRUCT LOGIC
      // ------------------------------------------------------------------
      useEffect(() => {
        if (!currentUser) return;
        const messagesRef = db.ref('messages');
        
        const listener = messagesRef.on('value', (snapshot) => {
          const data = snapshot.val();
          const allMsgs = [];
          if (data) {
            Object.keys(data).forEach(key => {
              allMsgs.push({ ...data[key], firebaseId: key });
            });
          }
          allMsgs.sort((a, b) => a.timestamp - b.timestamp);
          
          let loadedMessages = [];
          let newMessagesToProcess = [];

          if (isMaster) {
            // Reggae (Master): sees all messages, persists indefinitely (since they stay in DB).
            loadedMessages = allMsgs;
            newMessagesToProcess = loadedMessages.filter(
                m => !prevMessagesRef.current.some(p => p.firebaseId === m.firebaseId)
            );
          } else { 
            // Phish (Transient): All messages (hers or Reggae's) self-destruct after 5s.
            
            const currentDbIds = new Set(allMsgs.map(m => m.firebaseId));
            const existingLocalIds = new Set(prevMessagesRef.current.map(m => m.firebaseId));
            
            // 1. Find messages that are in the DB now but not yet in Phish's local state.
            const newlyAppearedDbMsgs = allMsgs.filter(m => !existingLocalIds.has(m.firebaseId));

            // 2. Start with existing local messages that still exist in DB (i.e., not deleted by Reggae)
            loadedMessages = prevMessagesRef.current.filter(m => currentDbIds.has(m.firebaseId));

            // 3. Add newly appeared messages
            newlyAppearedDbMsgs.forEach(newMsg => {
                loadedMessages.push(newMsg);
                newMessagesToProcess.push(newMsg); 
            });
            loadedMessages.sort((a, b) => a.timestamp - b.timestamp);
          }

          // Sound Play Logic (Only when a new message appears)
          if (newMessagesToProcess.length > 0 && currentUser) {
            const latestNewMsg = newMessagesToProcess[newMessagesToProcess.length - 1];
            if (latestNewMsg.sender !== currentUser) {
              playReceiveSound(); 
            }
          }
          
          setMessages(loadedMessages);
          prevMessagesRef.current = loadedMessages; 
          
          // --- Self-Destruct Logic (Phish only) ---
          if (!isMaster) {
              newMessagesToProcess.forEach(msg => {
                // Clear existing timeout if it somehow arrived again (e.g., initial load)
                if (transientTimeoutsRef.current[msg.firebaseId]) {
                    clearTimeout(transientTimeoutsRef.current[msg.firebaseId]);
                }
                
                // Set the 5-second timeout to remove the message from Phish's local state
                const timeoutId = setTimeout(() => {
                    setMessages(prev => prev.filter(m => m.firebaseId !== msg.firebaseId));
                    delete transientTimeoutsRef.current[msg.firebaseId];
                }, 5000); 
                
                transientTimeoutsRef.current[msg.firebaseId] = timeoutId;
              });
          }
        });

        return () => {
          messagesRef.off('value', listener);
          // Clean up all timeouts on logout/unmount
          Object.values(transientTimeoutsRef.current).forEach(clearTimeout);
          transientTimeoutsRef.current = {};
        };
      }, [currentUser, isMaster]);


      // 🔒 SECURITY IMPLEMENTATION: NO SCREENSHOT (PHISH ONLY) 🔒
      useEffect(() => {
        if (isMaster || !currentUser) return; 

        const chatContent = document.getElementById('chat-content');
        if (!chatContent) return;

        chatContent.style.setProperty('-webkit-user-select', 'none');
        chatContent.style.setProperty('user-select', 'none');

        const handleCopy = (e) => {
          e.preventDefault();
        };

        const applyMask = () => { chatContent.classList.add('secure-mask'); };
        const removeMask = () => { chatContent.classList.remove('secure-mask'); };
        
        const handleVisibilityChange = () => {
          if (document.hidden) {
            applyMask();
          } else {
            removeMask();
          }
        };
        
        const handleKeyDown = (e) => {
            if (e.key === 'PrintScreen' || (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4'))) {
                applyMask();
                setTimeout(removeMask, 500);
            }
        };

        document.addEventListener('copy', handleCopy);
        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('copy', handleCopy);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('keydown', handleKeyDown);
          chatContent.style.removeProperty('-webkit-user-select');
          chatContent.classList.remove('secure-mask');
        };
      }, [currentUser, isMaster]);


      // Auto-scroll to bottom
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // 🗑️ Master Deletion Function (Mutual)
      const deleteMessageMutual = (firebaseId) => {
        if (!isMaster) return;
        
        // This deletes the message from Firebase, instantly deleting it for both users
        db.ref(`messages/${firebaseId}`).remove()
          .catch(error => console.error("Error deleting message: ", error));
      };


      // Handle login
      const handleLogin = () => {
        const normalized = nickname.trim().toLowerCase();
        
        if (normalized === 'regae' || normalized === 'phish') {
          setCurrentUser(normalized);
          sessionStorage.setItem('hushvenus_user', normalized);
          setError('');
        } else {
          setError('Sorry, that\'s not the right nickname.');
        }
      };

      const handleLoginKeyPress = (e) => {
        if (e.key === 'Enter') {
          handleLogin();
        }
      };

      // 🛑 REMOVED AUTO-DELETION: All messages now persist in DB for Reggae.
      const sendMessage = () => {
        if (!inputMessage.trim() || !currentUser) return;

        const newMessage = {
          text: inputMessage,
          sender: currentUser,
          timestamp: Date.now()
        };
        
        const messageRef = db.ref('messages').push();
        messageRef.set(newMessage);

        setInputMessage('');
        // Self-destruction is handled in Phish's useEffect listener (if not master).
      };

      const handleMessageKeyPress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      // Ping other user (remains the same)
      const pingUser = () => {
        const otherUser = currentUser === 'regae' ? 'phish' : 'regae';
        const otherDisplayName = getDisplayName(otherUser);
        const email = currentUser === 'regae' 
          ? 'sophiapecina24@yahoo.com' 
          : 'rhlaroya@gmail.com';

        const subject = 'talk?';
        const body = 'talk?';
        const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        
        window.open(mailtoLink, '_blank');
        
        const notification = {
          id: Date.now(),
          text: `📧 Opening email to ${otherDisplayName}...`,
          sender: 'system',
          timestamp: Date.now()
        };
        setMessages(prev => [...prev, notification]);
        
        setTimeout(() => {
          setMessages(prev => prev.filter(msg => msg.id !== notification.id));
        }, 3000);
      };

      // Logout (remains the same)
      const logout = () => {
        db.ref(`users/${currentUser}/online`).set(false);
        db.ref(`users/${currentUser}/online`).onDisconnect().cancel();
        
        sessionStorage.removeItem('hushvenus_user');
        setCurrentUser(null);
        setMessages([]);
      };

      // Login page (remains the same)
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-purple-900 via-pink-900 to-red-900 flex items-center justify-center p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full shadow-2xl">
              <h1 className="text-4xl font-bold text-white text-center mb-2">Hush</h1>
              <p className="text-pink-200 text-center mb-8">Messages here never existed nor happened</p>
              
              <div className="space-y-4">
                <div>
                  <label className="block text-white mb-2 text-sm font-medium">
                    What is the nickname I gave you?
                  </label>
                  <input
                    type="text"
                    value={nickname}
                    onChange={(e) => setNickname(e.target.value)}
                    onKeyPress={handleLoginKeyPress}
                    className="w-full px-4 py-3 rounded-lg bg-white/20 text-white placeholder-pink-200 border border-white/30 focus:outline-none focus:ring-2 focus:ring-pink-400"
                    placeholder="Enter your nickname"
                    autoFocus
                  />
                </div>
                
                {error && (
                  <p className="text-red-300 text-sm">{error}</p>
                )}
                
                <button
                  onClick={handleLogin}
                  className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-3 rounded-lg font-semibold hover:from-pink-600 hover:to-purple-600 transition-all transform hover:scale-105"
                >
                  Enter
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Chat page
      const otherUserKey = currentUser === 'regae' ? 'phish' : 'regae';
      
      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-900 via-pink-900 to-red-900 flex flex-col">
          <div className="bg-white/10 backdrop-blur-lg border-b border-white/20 p-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-bold text-white">Hush {isMaster ? '👑' : '👻'}</h1>
                <p className="text-pink-200 text-sm">Logged in as {getDisplayName(currentUser)}</p>
              </div>
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-white/10 px-3 py-2 rounded-lg">
                  <div className={`w-2 h-2 rounded-full ${onlineUsers[otherUserKey] ? 'bg-green-400' : 'bg-gray-400'}`}></div>
                  <span className="text-white text-sm">
                    {getDisplayName(otherUserKey)} - {onlineUsers[otherUserKey] ? 'Online' : 'Offline'}
                  </span>
                </div>
                
                <button
                  onClick={pingUser}
                  className="flex items-center gap-2 bg-yellow-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-yellow-600 transition-all"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                  </svg>
                  Ping {getDisplayName(otherUserKey)}
                </button>
                <button
                  onClick={logout}
                  className="bg-white/20 text-white px-4 py-2 rounded-lg font-medium hover:bg-white/30 transition-all"
                >
                  Logout
                </button>
              </div>
            </div>
          </div>

          <div id="chat-content" className="flex-1 overflow-y-auto p-4">
            <div className="max-w-4xl mx-auto space-y-3">
              {messages.length === 0 && (
                <div className="text-center text-pink-200 mt-20">
                  <p className="text-lg">No messages yet. Start chatting!</p>
                  <p className="text-sm mt-2">Messages here never existed nor happened ✨</p>
                </div>
              )}
              
              {messages.map((msg) => (
                <div
                  key={msg.firebaseId || msg.id} 
                  className={`flex ${msg.sender === 'system' ? 'justify-center' : msg.sender === currentUser ? 'justify-end' : 'justify-start'} animate-fade-in`}
                >
                  <div
                    className={`max-w-xs px-4 py-2 rounded-2xl ${
                      msg.sender === 'system'
                        ? 'bg-white/20 text-white text-sm'
                        : msg.sender === currentUser
                        ? 'bg-gradient-to-r from-pink-500 to-purple-500 text-white'
                        : 'bg-white/90 text-gray-800'
                    }`}
                  >
                    {msg.sender !== 'system' && (
                      <p className="text-xs opacity-70 mb-1">
                        {getDisplayName(msg.sender)}
                      </p>
                    )}
                    <p>{msg.text}</p>
                  </div>
                  
                  {/* 🗑️ Master Delete Button (Reggae Only) */}
                  {isMaster && msg.sender !== 'system' && (
                    <button
                      onClick={() => deleteMessageMutual(msg.firebaseId)}
                      className="text-white/50 hover:text-red-400 p-1 transition-all text-sm ml-2 self-start"
                      title="Delete Permanently"
                    >
                      X
                    </button>
                  )}
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>
          </div>

          <div className="bg-white/10 backdrop-blur-lg border-t border-white/20 p-4">
            <div className="max-w-4xl mx-auto flex gap-2">
              <input
                type="text"
                value={inputMessage}
                onChange={(e) => setInputMessage(e.target.value)}
                onKeyPress={handleMessageKeyPress}
                placeholder="Type a message..."
                className="flex-1 px-4 py-3 rounded-lg bg-white/20 text-white placeholder-pink-200 border border-white/30 focus:outline-none focus:ring-2 focus:ring-pink-400"
              />
              <button
                onClick={sendMessage}
                className="bg-gradient-to-r from-pink-500 to-purple-500 text-white px-6 py-3 rounded-lg font-semibold hover:from-pink-600 hover:to-purple-600 transition-all transform hover:scale-105 flex items-center gap-2"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                Send
              </button>
            </div>
          </div>

          <style>{`
            .secure-mask {
              /* This makes the background of the chat content solid white, obscuring messages */
              background-color: white !important; 
              transition: background-color 0.1s ease;
            }
            
            @keyframes fade-in {
              from {
                opacity: 0;
                transform: translateY(10px);
              }
              to {
                opacity: 1;
                transform: translateY(0);
              }
            }
            .animate-fade-in {
              animation: fade-in 0.3s ease-out;
            }
          `}</style>
        </div>
      );
    }

    ReactDOM.render(<HushApp />, document.getElementById('root'));
  </script>
</body>
</html>
